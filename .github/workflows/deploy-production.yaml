name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'

# env:
#   AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
#   AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
#   AWS_REGION: us-east-1
#   SERVICE_NAME: backstage
#   GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "🚀 Deploying version: $VERSION (tag: $TAG)"

      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify checkout at correct tag
        run: |
          CURRENT_TAG=$(git describe --tags --exact-match 2>/dev/null || echo "")
          EXPECTED_TAG="${{ steps.version.outputs.tag }}"
          
          if [ "$CURRENT_TAG" != "$EXPECTED_TAG" ]; then
            echo "❌ Error: Not on the expected tag"
            echo "Expected: $EXPECTED_TAG"
            echo "Current: $CURRENT_TAG"
            exit 1
          fi
          
          echo "✅ Verified checkout at tag: $CURRENT_TAG"
          echo "Commit SHA: ${{ github.sha }}"

      

      - name: Deployment summary
        if: success()
        run: |
          echo "## Production Deployment Complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`${{ steps.version.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed at:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version ${{ steps.version.outputs.version }} failed to deploy to production." >> $GITHUB_STEP_SUMMARY
          echo "Please check the workflow logs for details." >> $GITHUB_STEP_SUMMARY
