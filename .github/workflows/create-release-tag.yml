name: Create Release Tag

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.2.3). Leave empty to use version from package.json'
        required: false
        type: string

jobs:
  create-tag:
    runs-on: [ubuntu]
    
    steps:
      - name: Validate branch
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          if [[ "$BRANCH_NAME" != "main" ]] && [[ ! "$BRANCH_NAME" =~ ^main-rc-v ]]; then
            echo "❌ Error: This workflow can only be run on 'main' branch or branches matching 'main-rc-v*'"
            echo "Current branch: $BRANCH_NAME"
            exit 1
          fi
          echo "✅ Branch validation passed: $BRANCH_NAME"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine release tag
        id: determine_tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            # Read version from package.json and prefix with 'v'
            VERSION=$(node -p "require('./package.json').version")
            TAG="v${VERSION}"
          fi
          
          # Validate semver format
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Error: Tag must follow semantic versioning format (v*.*.*, e.g., v1.2.3)"
            echo "Provided tag: $TAG"
            exit 1
          fi
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "✅ Release tag will be: $TAG"

      - name: Check if tag already exists
        run: |
          TAG="${{ steps.determine_tag.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "❌ Error: Tag $TAG already exists"
            exit 1
          fi
          echo "✅ Tag $TAG does not exist, proceeding..."

      - name: Create and push tag
        run: |
          TAG="${{ steps.determine_tag.outputs.tag }}"
          BRANCH="${{ github.ref_name }}"
          
          # Create annotated tag
          git tag -a "$TAG" -m "Release $TAG from branch $BRANCH"
          
          # Push tag
          git push origin "$TAG"
          
          echo "✅ Successfully created and pushed tag: $TAG"

      - name: Summary
        run: |
          TAG="${{ steps.determine_tag.outputs.tag }}"
          echo "## Release Tag Created 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`$TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The production deployment workflow will be triggered automatically." >> $GITHUB_STEP_SUMMARY
